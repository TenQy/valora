name: valora_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  google_fonts: ^8.1.0
  app_links: ^6.3.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logos/

flutter_native_splash:
  color: "#080808"
  android_12:
    color: "#080808"
    image: assets/logos/app_icon_splash.png
  fullscreen: true